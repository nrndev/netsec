name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - run: make test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      K3D_VERSION: v5.9.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh | TAG="$K3D_VERSION" bash
      # k3d-load-test-images only loads images that are already local.
      - name: Pull the test images
        run: |
          images=$(make -s -p -n 2>/dev/null | sed -n 's/^TEST_IMAGES ?*= *//p' | head -n1)
          [ -n "$images" ] || { echo "could not read TEST_IMAGES from the Makefile"; exit 1; }
          for i in $images; do docker pull "$i"; done
      - run: make k3d-up
      - run: make k3d-load-test-images
      - run: make test-e2e
      - run: make verify-isolation
      - run: make helm-check
      - name: Delete the cluster
        if: always()
        run: make k3d-down
