# This rule is not used by the project netsec itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to netsec.nrnx.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: netsec
    app.kubernetes.io/managed-by: kustomize
  name: networkisolation-viewer-role
rules:
- apiGroups:
  - netsec.nrnx.dev
  resources:
  - networkisolations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - netsec.nrnx.dev
  resources:
  - networkisolations/status
  verbs:
  - get
