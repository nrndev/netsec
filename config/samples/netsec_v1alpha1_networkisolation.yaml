apiVersion: netsec.nrnx.dev/v1alpha1
kind: NetworkIsolation
metadata:
  labels:
    app.kubernetes.io/name: netsec
    app.kubernetes.io/managed-by: kustomize
  name: contain-gateway-dashboard
spec:
  reason: "INC-1234: suspected compromise"
  between:
    - name: gateway
      namespaces: [tenant-a]
      podSelector:
        matchLabels: {app: gateway}
    - name: dashboard
      namespaces: [tenant-b]
      podSelector:
        matchLabels: {app: dashboard}
